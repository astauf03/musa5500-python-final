site_name: Passyunk Square Neighborhood Accessibility Character Map
theme:
  name: material
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - navigation.top
nav:
  - Home: index.md
  - Project Overview: project_overview.md
  - Data Sources: data_sources.md
  - Methodology: methodology.md
  - Analysis:
      - Mobility Score: analysis/mobility_score.md
      - Environmental Score: analysis/environmental_score.md
      - Land Use Score: analysis/land_use_score.md
      - Social Score: analysis/social_score.md
      - Accessibility Score: analysis/accessibility_score.md
  - Results:
      - Score Interpretation: results.md
      - Boxplots vs City Overview: boxplots_interpretation.md
      - Interactive Maps: interactive_maps.md
  - Conclusion: conclusion.md
  - Limitations: limitations.md
markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
